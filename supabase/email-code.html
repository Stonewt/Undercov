<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Ton code Bon'Assiette</title></head>
<body style="margin:0;padding:0;background:#f2f4ef;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f2f4ef;padding:32px 16px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:16px;border:1px solid #dde3dc;">
      <tr><td style="padding:28px 28px 8px 28px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
        <div style="font-size:20px;font-weight:800;color:#2f6b3c;letter-spacing:-0.3px;">Bon'Assiette</div>
      </td></tr>
      <tr><td style="padding:12px 28px 0 28px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#18201b;">
        <div style="font-size:22px;font-weight:700;line-height:1.3;">Ton code de connexion</div>
        <p style="margin:10px 0 0 0;font-size:15px;line-height:1.5;color:#56635a;">Tape ce code dans l'appli, là où tu as saisi ton adresse e-mail.</p>
      </td></tr>
      <tr><td style="padding:22px 28px;">
        <div style="background:#e2eee3;border-radius:12px;padding:18px 0;text-align:center;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:34px;font-weight:700;letter-spacing:8px;color:#18201b;">{{ .Token }}</div>
      </td></tr>
      <tr><td style="padding:0 28px 28px 28px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.5;color:#56635a;">
        Le code est valable 1 heure. Si tu n'as rien demandé, ignore simplement cet e-mail : personne ne peut se connecter sans ce code.
      </td></tr>
    </table>
    <p style="margin:16px 0 0 0;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;color:#56635a;">bonassiette.fr · Mange mieux, sans te ruiner.</p>
  </td></tr>
</table>
</body>
</html>
